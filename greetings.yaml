apiVersion: apps/v1
kind: Deployment
metadata:
  name: greetings
  labels:
    app: greetings
spec:
  # One replica so that the counts Prometheus scrapes through the NodePort always
  # come from the same Pod (each Pod keeps its own counter).
  replicas: 1
  selector:
    matchLabels:
      app: greetings
  template:
    metadata:
      labels:
        app: greetings
    spec:
      serviceAccount: greetings
      containers:
        - name: assignment4
          image: avk639-assignment4:latest
          imagePullPolicy: IfNotPresent # Never
          ports:
            - containerPort: 5001
          env:
            - name: GREETING
              value: "Fall is here."
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          volumeMounts:
            - name: greetings-config-volume
              mountPath: /hostfolder
      volumes:
        - name: greetings-config-volume
          configMap:
            name: greetings-config
---
kind: Service
apiVersion: v1
metadata:
  name: greetings
  labels:
    app: greetings
spec:
  selector:
    app: greetings
  ports:
  - protocol: TCP
    port: 80
    targetPort: 5001
    nodePort: 32767
  type: NodePort
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: greetings-config
  labels:
    app: greetings
data:
  filenames.txt: |
    application.py
    Dockerfile
    requirements.txt
    build.sh
    greetings.yaml
    prometheus.yml
    README.txt
    AI.txt
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: greetings
  namespace: default
  labels:
    app: greetings
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: greetings-reader-role
  namespace: default
  labels:
    app: greetings
rules:
  - apiGroups: [""]
    resources: ["pods", "configmaps", "serviceaccounts"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: greetings-reader-rolebinding
  namespace: default
  labels:
    app: greetings
subjects:
  - kind: ServiceAccount
    name: greetings
    namespace: default
roleRef:
  kind: Role
  name: greetings-reader-role
  apiGroup: rbac.authorization.k8s.io
